<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruokapäiväkirja</title>
    <!-- Bootstrap styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Food Log</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Kirjaa ruoka-aines</h2>
            <form id="foodForm" novalidate>
                <div class="form-group">
                    <label for="daySelect">Viikonpäivä:</label>
                    <select id="daySelect">
                        <option value="Maanantai">Maanantai</option>
                        <option value="Tiistai">Tiistai</option>
                        <option value="Keskiviikko">Keskiviikko</option>
                        <option value="Torstai">Torstai</option>
                        <option value="Perjantai">Perjantai</option>
                        <option value="Lauantai">Lauantai</option>
                        <option value="Sunnuntai">Sunnuntai</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="foodType">Ruoka-aines:</label>
                    <input type="text" id="foodType" placeholder="esim. Kana">
                    <span class="error-message" id="foodTypeError"></span>
                </div>

                <div class="form-group">
                    <label for="weight">Paino (g):</label>
                    <input type="number" id="weight" placeholder="200" min="1">
                    <span class="error-message" id="weightError"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="calories">Kalorit (kcal):</label>
                        <input type="number" id="calories" placeholder="200" min="0">
                    </div>
                    <div class="form-group">
                        <label for="proteins">Proteiini (g):</label>
                        <input type="number" id="proteins" placeholder="40" min="0">
                    </div>
                    <div class="form-group">
                        <label for="fats">Rasva (g):</label>
                        <input type="number" id="fats" placeholder="5" min="0">
                    </div>
                    <div class="form-group">
                        <label for="carbs">Hiilihydraatti (g):</label>
                        <input type="number" id="carbs" placeholder="0" min="0">
                    </div>
                </div>

                <button type="submit" id="addBtn">Lisää ateriaan</button>
            </form>
        </section>

        <!-- Suodatus ja listaus -->
        <section class="log-display">
            <h2>Syötetyt ruoat viikonpäivittäin</h2>
            
            <div id="daysContainer">
                <!-- JavaScript luo tänne viikonpäiväkohtaiset taulukot -->
            </div>

            <div class="actions">
                <button id="clearWeekBtn" class="danger-btn">Tyhjennä viikko / Aloita uusi viikko</button>
            </div>
        </section>
    </main>

<!-- Bootstrapin JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js" defer></script>
</body>
</html>
